server {
    listen 80;
    client_max_body_size 6m;   # resumes can be up to 5 MB; nginx's default limit is 1 MB

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;   # keeps the port (3000), so the browser's Origin matches
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;   # lets React Router handle page URLs
    }
}